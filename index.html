<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111519">
<meta name="description" content="塞尼特棋 · Kendall 复原规则图解：一课一个规则，一个场景，点一下看结果。">
<title>塞尼特棋 · 玩法图解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 与实体棋同一套三色：黑 #111519 / 金 #CB983C / 红 #BA3024 */
  --black:#111519;--black-2:#181d22;--black-3:#20262c;--line:#2b3238;
  --gold:#cb983c;--gold-hi:#ecc777;--gold-lo:#8a6424;--gold-deep:#5c4114;
  --red:#ba3024;--red-hi:#e0604f;
  --ivory:#ece0c4;--muted:#a59273;
  --display:"Noto Serif SC","Songti SC",STSong,serif;
  --latin:"Marcellus SC","Cinzel",Georgia,serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --goldfill:linear-gradient(180deg,#f2d38a 0%,#d9a548 45%,#b07f2b 100%);
  /* 双金线框：和棋盘盖、侧板的边框一致 */
  --frame:0 0 0 1px var(--gold),0 0 0 4px var(--black),0 0 0 5px var(--gold-lo);
}
*,*:before,*:after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{font-synthesis:none}
body{background:radial-gradient(120% 60% at 50% 30%,#1a2026 0%,var(--black) 60%,#0b0e11 100%) fixed,var(--black);color:var(--ivory);font:15px/1.6 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- 手机外壳：哑光黑 + 双金线框 ---------- */
/* 全屏铺满，不做假手机框；内容在居中的一栏里，最宽 520px（大屏手机、折叠屏内屏也不会拉得太散） */
.phone{position:relative;width:100%;max-width:520px;margin:0 auto;height:100vh;height:100dvh;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
/* 双金线框贴着屏幕边缘，像棋盘盖的边框；避开刘海和圆角 */
body:after{content:"";position:fixed;pointer-events:none;z-index:5;
  top:max(5px,calc(env(safe-area-inset-top) - 4px));bottom:max(5px,calc(env(safe-area-inset-bottom) - 4px));
  left:max(5px,env(safe-area-inset-left));right:max(5px,env(safe-area-inset-right));
  border:1px solid var(--gold-lo);box-shadow:inset 0 0 0 3px var(--black),inset 0 0 0 4px #cb983c55}
.rule2{height:4px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold-lo);margin:0 12px}

/* ---------- 顶栏 / 底栏 ---------- */
.bar{position:relative;z-index:2;color:var(--gold-hi)}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 18px) 9px calc(env(safe-area-inset-left) + 18px)}
.brand{display:flex;align-items:center;gap:8px;font:700 13px/1 var(--latin);letter-spacing:.24em;color:var(--gold-hi)}
.brand svg{width:26px;height:16px;color:var(--gold)}
.top .count{font:600 12px/1 var(--latin);letter-spacing:.2em;color:var(--muted)}
.iconbtn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 4px;font:500 13px/1 var(--body);color:var(--gold-hi)}
.iconbtn svg{width:18px;height:18px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 16px max(env(safe-area-inset-bottom),14px)}
.nav button{display:grid;place-items:center;width:60px;height:42px;border-radius:21px;color:var(--gold-hi);
  box-shadow:inset 0 0 0 1px var(--gold),0 0 0 3px var(--black),0 0 0 4px var(--gold-lo)}
.nav button:active{background:#cb983c22}
.nav button:disabled{opacity:.25;cursor:default}
.nav svg{width:26px;height:26px}
.nav svg.back{transform:scaleX(-1)}
.dots{display:flex;gap:6px}
.dots i{width:6px;height:6px;transform:rotate(45deg);background:#3a3326}
.dots i.on{background:var(--gold-hi);box-shadow:0 0 8px var(--gold)}

main{position:relative;z-index:1;min-height:0;overflow:hidden}
.view{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:14px 20px 14px;display:flex;flex-direction:column}
.view::-webkit-scrollbar{display:none}
.view>*{flex-shrink:0}
.view.enter{animation:enter .38s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateX(var(--dx,14px))}to{opacity:1;transform:none}}

/* 金色浮雕字 */
.carve{background:var(--goldfill);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #000)}

/* ---------- 封面 ---------- */
.cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:8px 0 2px}
.over{margin:6px 0 0;font:600 10.5px/1 var(--latin);letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
.portal{width:min(80%,360px,40dvh);height:auto;filter:drop-shadow(0 10px 18px #000a)}
.cover h1{margin:0;line-height:1}
.cover .cn{display:block;font:600 clamp(24px,7.4vw,30px)/1 var(--display);letter-spacing:.46em;margin-right:-.46em}
.cover .lat{display:block;margin-top:10px;font:700 clamp(54px,17vw,76px)/.9 var(--latin);letter-spacing:.08em;margin-right:-.08em}
.cover .tag{margin:12px 0 0;font:500 13px/1.8 var(--display);letter-spacing:.18em;color:var(--muted)}
.cta{display:inline-flex;align-items:center;gap:10px;padding:15px 44px;border-radius:2px;background:var(--goldfill);
  color:var(--black);font:700 17px/1 var(--display);letter-spacing:.32em;box-shadow:0 0 0 1px #000,0 0 0 3px var(--gold-lo),0 12px 24px #000a}
.cover .src{margin:12px 0 0;font:500 11.5px/1.6 var(--body);color:var(--muted);letter-spacing:.04em}

/* ---------- 课程 ---------- */
.kicker{display:flex;align-items:center;gap:8px;margin:0 0 6px;font:700 12.5px/1 var(--display);letter-spacing:.2em;color:var(--gold)}
.kicker .cno{font:700 12px/1 var(--latin);letter-spacing:.1em;padding:3px 5px 2px;border:1px solid var(--gold-lo)}
.kicker .sub{order:3;font:600 11px/1 var(--latin);letter-spacing:.12em;color:var(--muted)}
.kicker:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-lo),transparent)}
.ltitle{margin:0;font:700 clamp(24px,7vw,28px)/1.25 var(--display);letter-spacing:.05em}
.rule{margin:8px 0 14px;font:400 14px/1.7 var(--body);color:#d9ccb0}
.rule em{font-style:normal;font-weight:700;color:var(--gold-hi)}
.rule .hl{display:block;margin:4px 0;font:700 17px/1.5 var(--display);letter-spacing:.04em;color:var(--gold-hi)}

/* 面板：像棋盘盖一样的黑底双金线 */
.shrinebox{position:relative;flex:1 0 auto;display:flex;flex-direction:column;border-radius:2px;margin:5px;
  background:linear-gradient(180deg,#1b2025,#14181c);box-shadow:var(--frame),0 16px 30px #0009;padding:12px 12px 14px;color:var(--ivory)}
.shrinebox:before,.shrinebox:after{content:"";position:absolute;top:6px;width:3px;height:3px;background:var(--gold);transform:rotate(45deg)}
.shrinebox:before{left:6px}.shrinebox:after{right:6px}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:6px}
.caption{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding-top:12px;border-top:1px solid #cb983c40;min-height:62px}
.caption .seal{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--display);
  background:var(--goldfill);color:var(--black)}
.caption .seal svg{width:13px;height:18px}
.caption.bad .seal{background:radial-gradient(circle at 35% 30%,#e86b58,var(--red));color:#fff}
.caption p{margin:0;font:400 14px/1.65 var(--body);color:#ddd0b3}
.caption p b{color:var(--gold-hi);font-weight:700}
.caption p strong{display:block;font:700 16px/1.4 var(--display);color:var(--gold-hi);margin-bottom:1px}
.caption.bad p strong{color:var(--red-hi)}
.caption.anim{animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}

.actions{display:flex;justify-content:center;margin-top:18px}
.act{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:200px;padding:14px 26px;border-radius:2px;
  background:var(--goldfill);color:var(--black);font:700 16px/1 var(--display);letter-spacing:.16em;
  box-shadow:0 0 0 1px #000,0 0 0 3px var(--gold-lo),0 10px 20px #0009}
.act.ghost{background:transparent;color:var(--gold-hi);box-shadow:0 0 0 1px var(--gold),0 0 0 4px var(--black),0 0 0 5px var(--gold-lo)}
.act svg{width:15px;height:15px}

/* ---------- 格子：照棋盘盖做，黑格 + 细金线 ---------- */
.track{position:relative;padding-top:30px}
.trow{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,64px));justify-content:center;gap:1.5px;
  width:fit-content;max-width:100%;margin:0 auto;padding:1.5px;background:var(--gold)}
.cell{position:relative;aspect-ratio:.62;display:flex;align-items:flex-end;justify-content:center;background:var(--black-3)}
.cell .num{position:absolute;left:3px;top:2px;font:700 9.5px/1 var(--latin);color:#8d7a58}
.cell .mk{position:absolute;inset:20% 16% 30%;width:68%;height:50%;color:var(--gold)}
.cell.fr:before{content:"";position:absolute;inset:12% 10%;border:1.5px solid var(--gold);pointer-events:none}
.cell.fr .mk{inset:24% 22% 32%;width:56%;height:44%}
.cell.water:before{content:"";position:absolute;inset:12% 10%;border:1.5px solid var(--red);pointer-events:none}
.cell.water .mk{inset:24% 22% 32%;width:56%;height:44%;color:var(--red-hi)}
.cell.target{background:#2c2a22;box-shadow:inset 0 0 0 2px var(--gold-hi),inset 0 0 14px #cb983c66}
.cell.bad{background:#3a1a16}
.cell.bad:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px var(--red-hi)}
.cell.out{background:repeating-linear-gradient(135deg,#1a1f24 0 6px,#111519 6px 12px)}
.cell.out .num{font:500 9px/1 var(--body);letter-spacing:.1em;color:var(--gold-hi)}
.pc{position:relative;z-index:2;width:72%;height:auto;aspect-ratio:40/64;margin-bottom:7%;filter:drop-shadow(0 3px 3px #000)}
.pc.mover{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.arrow{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.arrow path{fill:none;stroke:var(--gold-hi);stroke-width:2;stroke-dasharray:5 5;stroke-linecap:round;animation:dash 1s linear infinite}
.arrow .head{fill:var(--gold-hi);stroke:none;animation:none}
@keyframes dash{to{stroke-dashoffset:-20}}
.rollpill{display:inline-flex;align-items:center;gap:8px;margin:0 auto 4px;padding:5px 12px 5px 8px;border-radius:999px;border:1px solid #cb983c66;color:var(--gold-hi);font:700 12.5px/1 var(--body);letter-spacing:.08em}
.rollpill .ms{display:inline-flex;gap:2px}
.rollpill .ms i{width:4px;height:15px;border-radius:2px 2px 1px 1px;background:var(--gold)}
.rollpill .ms i.d{background:#0b0e11;box-shadow:0 0 0 1px var(--gold-lo) inset}
.stagehead{display:flex;justify-content:center}

/* 整张棋盘 */
.boardwrap{position:relative;padding:16px 7px 7px;margin:2px 0 0;border:1px solid var(--gold);box-shadow:inset 0 0 0 3px var(--black-2),inset 0 0 0 4px var(--gold-lo)}
.boardwrap .start{position:absolute;left:28px;top:6px;width:72px;height:6px;color:var(--gold)}
.board{position:relative;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:1.5px;padding:1.5px;background:var(--gold)}
.board .cell{aspect-ratio:1}
.board .pc{width:62%;margin-bottom:3%}
.board .num{font-size:8px;left:2px;top:1px}
.routeline{position:absolute;inset:1.5px;width:calc(100% - 3px);height:calc(100% - 3px);pointer-events:none;z-index:3}
.routeline path{fill:none;stroke:var(--red-hi);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;margin-top:14px}
.legend span{display:flex;align-items:center;gap:6px;font:500 12px/1.3 var(--body);color:#ddd0b3}
.legend svg{flex:0 0 auto;width:16px;height:20px;color:var(--gold)}
.legend span:nth-child(3) svg{color:var(--red-hi)}

/* ---------- 掷棒：照实体做，一面金（平面）一面黑（弧面，金棕榈纹 + 红箍） ---------- */
.sticks{display:flex;justify-content:center;gap:clamp(14px,6vw,24px)}
.stick{width:clamp(30px,9vw,36px);height:clamp(110px,20dvh,168px);transition:transform .15s;filter:drop-shadow(0 6px 6px #000a)}
.stick svg{width:100%;height:100%;display:block}
.stick:active{transform:scale(.97)}
.sticklegend{display:flex;justify-content:center;gap:18px;margin-top:12px;font:500 11.5px/1 var(--body);color:#ddd0b3}
.sticklegend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.scoretable{display:grid;grid-template-columns:repeat(5,1fr);margin-top:12px;border:1px solid #cb983c66;overflow:hidden;font:500 11.5px/1 var(--body);text-align:center;color:var(--muted)}
.scoretable div{padding:7px 0 6px;border-left:1px solid #cb983c33;transition:background .2s}
.scoretable div:first-child{border-left:0}
.scoretable b{display:block;font:700 16px/1.3 var(--latin);color:var(--gold-hi);margin:3px 0 1px}
.scoretable .again{color:var(--gold-hi);font-weight:700}
.scoretable .cur{background:#cb983c2b;box-shadow:inset 0 -2px 0 var(--gold-hi)}

/* 背景与配件 */
.partshead{margin:0 0 8px;font:700 12px/1 var(--display);letter-spacing:.3em;color:var(--gold);text-align:center}
.parts{display:flex;flex-direction:column}
.part{display:grid;grid-template-columns:128px 1fr;align-items:center;gap:14px;padding:9px 2px;border-top:1px solid #cb983c2e}
.part:first-child{border-top:0}
.part .pic{display:flex;justify-content:center;align-items:flex-end}
.part .pb svg{width:124px;height:auto}
.part .pp svg{width:24px;height:38px;margin:0 -1px;filter:drop-shadow(0 2px 2px #000)}
.part .ps{gap:7px}.part .ps svg{width:11px;height:50px;filter:drop-shadow(0 2px 2px #000)}
.part p{margin:0}.part b{display:block;font:700 14.5px/1.4 var(--display);color:var(--gold-hi)}
.part small{display:block;font:400 12px/1.5 var(--body);color:var(--muted)}
.note{margin:10px 0 0;font:400 12px/1.6 var(--body);color:var(--muted);text-align:center}
.note b{color:var(--gold-hi);font-weight:700}
/* 弹窗 */
dialog{width:min(92vw,390px);max-height:82dvh;border:0;padding:0;border-radius:2px;background:var(--black-2);color:#ddd0b3;box-shadow:var(--frame),0 30px 80px #000c}
dialog::backdrop{background:#050607c4;backdrop-filter:blur(3px)}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid #cb983c44}
.dhead h2{margin:0;font:700 18px/1.2 var(--display);color:var(--gold-hi);letter-spacing:.06em}
.dhead button{font-size:24px;line-height:1;color:var(--gold-hi);width:36px;height:36px}
.dbody{padding:10px 16px 16px;overflow:auto;max-height:calc(82dvh - 60px);font:400 13.5px/1.7 var(--body)}
.dbody h3{margin:14px 0 4px;font:700 14px/1.4 var(--display);color:var(--gold-hi)}
.dbody p{margin:0 0 8px}.dbody ul{margin:0 0 8px;padding-left:18px}
.toc h3{display:flex;gap:10px;align-items:baseline;margin:14px 0 2px;font:700 13px/1.4 var(--display);color:var(--gold);letter-spacing:.12em}
.toc h3:first-child{margin-top:4px}.toc h3 span{font:700 12px/1 var(--latin)}
.toc button{display:block;width:100%;padding:9px 0 9px 32px;border-bottom:1px solid #cb983c2e;text-align:left;font:500 15px/1.4 var(--display);color:#ddd0b3}
.toc button[aria-current=true]{color:var(--gold-hi)}

/* 紧凑档：覆盖在微信里打开的所有 iPhone（可视高约 603–850） */
@media (max-height:860px),(max-width:370px){
  .view{padding-top:10px}
  .rule{font-size:13px;line-height:1.6;margin:6px 0 10px}
  .ltitle{font-size:23px}
  .trow .cell{aspect-ratio:.8}
  .track{padding-top:24px}
  .caption{margin-top:8px;padding-top:8px}
  .caption p{font-size:13px}
  .actions{margin-top:12px}
  .act{padding:12px 22px}
  .stick{height:clamp(74px,12dvh,104px)}
  .trow{grid-template-columns:repeat(var(--cols),minmax(0,54px))}
  .rule .hl{font-size:15.5px;margin:2px 0}.shrinebox{padding:8px 10px 10px}.caption{min-height:0}.kicker{margin-bottom:4px}.view{padding-bottom:10px}
  .scoretable{margin-top:8px}.sticklegend{margin-top:8px}.note{margin-top:6px;font-size:11.5px}
  .part{padding:5px 2px}.part .pp svg{width:20px;height:32px}.part .ps svg{height:40px}.partshead{margin-bottom:4px}
  .portal{width:min(76%,300px,38dvh)}
  .cover .lat{font-size:52px}
}
/* 超紧凑档：iPhone SE / 8 在微信里只有约 375×603 */
@media (max-height:640px){
  .top{padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:6px}
  .view{padding:6px 16px 6px}
  .kicker{margin-bottom:2px}
  .ltitle{font-size:20px}
  .rule{font-size:12.5px;line-height:1.55;margin:3px 0 7px}
  .rule .hl{font-size:14.5px;margin:1px 0}
  .shrinebox{padding:6px 8px 8px}
  .stage{padding-top:2px}
  .caption{margin-top:6px;padding-top:6px}.caption p{font-size:12.5px;line-height:1.55}.caption p strong{font-size:14.5px}
  .caption .seal{width:26px;height:26px}
  .actions{margin-top:9px}.act{padding:10px 20px;font-size:15px}
  .nav{padding-top:4px;padding-bottom:max(env(safe-area-inset-bottom),8px)}.nav button{height:36px}
  .track{padding-top:20px}.trow .cell{aspect-ratio:.95}
  .stick{height:58px}.sticklegend{margin-top:6px}.scoretable{margin-top:6px}.scoretable div{padding:4px 0 3px}.scoretable b{font-size:14px;margin:1px 0}
  .note{margin-top:4px;font-size:11px;line-height:1.5}
  .legend{margin-top:8px;gap:4px 6px}.legend span{font-size:11px}
  .part{padding:2px}.part .pp svg{width:17px;height:27px}.part .ps svg{height:30px}.part .pb svg{width:100px}.part b{font-size:13.5px}.part small{font-size:11px}
  .cover .lat{font-size:46px}.cover .cn{font-size:22px}.cta{padding:12px 40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-gold" x1="0" x2="1"><stop offset="0" stop-color="#6e4c16"/><stop offset=".3" stop-color="#f3d58e"/><stop offset=".55" stop-color="#d4a046"/><stop offset="1" stop-color="#7a5418"/></linearGradient>
    <linearGradient id="g-gold-v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dc9c"/><stop offset="1" stop-color="#a87a28"/></linearGradient>
    <linearGradient id="g-black" x1="0" x2="1"><stop offset="0" stop-color="#07090b"/><stop offset=".32" stop-color="#4a525a"/><stop offset=".5" stop-color="#22282e"/><stop offset="1" stop-color="#050607"/></linearGradient>
    <!-- 金色莲花柱：六瓣合拢的花苞 + 两级台座（照 3MF 模型） -->
    <symbol id="lotus" viewBox="0 0 40 64">
      <rect x="3.5" y="55" width="33" height="8" rx="1.2" fill="url(#g-gold)" stroke="#5c4114" stroke-width=".8"/>
      <path d="M4 58.6h32" stroke="#5c4114" stroke-width="1"/>
      <path d="M6.5 55.2C8 52.5 9.5 50.6 11.5 49.6h17c2 1 3.5 2.9 5 5.6z" fill="url(#g-gold)" stroke="#5c4114" stroke-width=".8"/>

<script id="senet-engine">
(function(root){
  "use strict";
  const EXIT=31;
  const other=s=>s==="g"?"b":"g";
  const clone=b=>Object.assign({},b);
  function run(board,n){ // 与 n 相连的同色棋所在格（按路线编号连续）
    const p=board[n]; if(!p)return [];
    let a=n,b=n;
    while(a>1&&board[a-1]&&board[a-1].side===p.side)a--;
    while(b<30&&board[b+1]&&board[b+1].side===p.side)b++;
    const r=[];for(let i=a;i<=b;i++)r.push(i);return r;
  }
  function sticks(faces){
    const light=faces.filter(Boolean).length, steps=light||5;
    return {light,steps,again:steps===1||steps===4||steps===5};
  }
  const fail=(reason,marks=[])=>({ok:false,reason,marks});
  function move(board,from,steps){
    const p=board[from];
    if(!p)return fail("empty");
    if(!Number.isInteger(steps)||steps<1||steps>5)return fail("steps");
    const to=from+steps, opp=other(p.side);
    if(from<26&&to>26)return fail("must_stop_26",[26]);
    for(let s=from+1;s<Math.min(to,EXIT);s++){
      if(board[s]&&board[s].side===opp){const r=run(board,s);if(r.length>=3)return fail("blockade",r);}
    }
    if(to>EXIT)return fail("overshoot",[from]);
    const next=clone(board); delete next[from];
    if(to===EXIT)return {ok:true,kind:"exit",board:next,moves:[{id:p.id,path:[from,"out"]}]};
    const t=board[to];
    if(t&&t.side===p.side)return fail("own",[to]);
    if(t){
      if(to===28||to===29)return fail("safe",[to]);
      const r=run(board,to); if(r.length>=3)return fail("blockade",r);
      if(r.length===2)return fail("protected",r);
      next[from]=t; next[to]=p;
      return {ok:true,kind:"swap",board:next,moves:[{id:p.id,path:[from,to]},{id:t.id,path:[to,from]}]};
    }
    if(to===27){
      let r=15; while(r>=1&&next[r])r--;
      if(r<1)return fail("no_rebirth",[15]);
      next[r]=p;
      return {ok:true,kind:"water",rebirth:r,board:next,moves:[{id:p.id,path:[from,27,r]}]};
    }
    next[to]=p;
    return {ok:true,kind:"move",board:next,moves:[{id:p.id,path:[from,to]}]};
  }
  function options(board,side,steps){
    return Object.keys(board).map(Number).filter(n=>board[n].side===side).sort((a,b)=>a-b)
      .map(from=>({from,result:move(board,from,steps)}));
  }
  function fromSpec(spec){const b={};for(const k in spec)b[k]={id:spec[k]+k,side:spec[k]};return b;}
  const API={EXIT,sticks,move,options,run,fromSpec};
  root.SenetEngine=API;
  if(typeof module==="object"&&module.exports)module.exports=API;
})(globalThis);
</script>

      scene:"金棋掷出 5，前面横着三枚相连的黑棋。",

      track:[T(22,28)],pieces:{24:"g"},from:24,roll:4,expect:"must_stop_26",

    {key:"water",glyphs:[15,27],ch:6,title:"第 27 格，落水重生",
      rule:"第 27 格是水之屋。<span class=\"hl\">停在这里，就被冲回第 15 格，</span>从重生之屋重新出发。",
      track:[T(13,16),T(25,28)],pieces:{26:"g"},from:26,roll:1,expect:"water",

    {key:"exit",glyphs:[26,28,29,30],ch:6,title:"最后一步，要刚刚好",
      rule:"最后几格，要掷出刚好的数才能离场：<span class=\"hl\">28 掷 3，29 掷 2，30 掷 1。</span>站在 26 格时掷 5，也能直接离场。",

<script>
(function(){

function reset(){
  const l=L();S.done=false;S.out=[];S.result=null;S.thrown=false;

}

const piece=(p,cls="")=>`<svg class="pc ${cls}" data-id="${p.id}" viewBox="0 0 40 64" aria-hidden="true"><use href="#${p.side==="g"?"lotus":"djed"}"/></svg>`;

  return `<div class="stagehead"><span class="rollpill"><span class="ms">${[0,1,2,3].map(i=>`<i class="${i<light?"":"d"}"></i>`).join("")}</span>掷出 ${n}</span></div>`;
}
function cell(n,o){
  if(n==="out")return `<div class="cell out" data-sq="out"><span class="num">离场</span>${S.out.map(p=>piece(p)).join("")}</div>`;
  const p=S.board[n],c=["cell"],l=L(),abs=l.abstract,mk=!abs&&MARK[n]&&(!l.glyphs||l.glyphs.includes(n))?MARK[n]:null;
  if(mk)c.push(n===27?"water":n===15||n===26?"sp fr":"sp");
  if(o.target===n)c.push("target");
  if(o.bad&&o.bad.includes(n))c.push("bad");
  return `<div class="${c.join(" ")}" data-sq="${n}">${abs?"":`<span class="num">${n}</span>`}${mk?use(mk,"mk"):""}${p?piece(p,o.mover===n?"mover":""):""}</div>`;
}
function trackHTML(l){
  const cols=Math.max(...l.track.map(r=>r.length)),o={};

  }

  let d="M"+pt(1).join(" ");for(let n=2;n<=30;n++)d+=" L"+pt(n).join(" ");d+=" L1040 250";
  return `<div class="boardwrap"><svg class="start" viewBox="0 0 72 6" aria-hidden="true"><path d="M0 3h64" stroke="currentColor" stroke-width="1.2"/><path d="M72 3 63 .5v5z" fill="currentColor"/></svg><div class="board">${cells.join("")}${S.done?`<svg class="routeline" viewBox="0 0 1000 300" preserveAspectRatio="none"><path id="route" d="${d}" pathLength="1" vector-effect="non-scaling-stroke"/></svg>`:""}</div></div>
   <div class="legend">

   </div>`;
}
const STICK="M18 2C23 7 29 17 31 26V151Q31 158 24 158H12Q5 158 5 151V26C7 17 13 7 18 2Z";
const fan=(x,y,dir)=>[-54,-36,-18,0,18,36,54].map(a=>{const r=a*Math.PI/180,L=21-Math.abs(a)/10;return `M${x} ${y}Q${x+Math.sin(r)*L*.35} ${y+dir*L*.5} ${(x+Math.sin(r)*L*.62).toFixed(1)} ${(y+dir*Math.cos(r)*L).toFixed(1)}`;}).join("");

}
function miniBoard(){
  let g="";for(let i=1;i<10;i++)g+=`M${i*10+1} 1V31`;g+="M1 11H101M1 21H101";
  return `<svg viewBox="0 0 102 32" aria-hidden="true"><rect x=".5" y=".5" width="101" height="31" fill="#20262c" stroke="#cb983c"/><path d="${g}" stroke="#cb983c" stroke-width=".6"/>
    <rect x="53" y="13" width="6" height="6" fill="none" stroke="#cb983c" stroke-width=".7"/><rect x="53" y="23" width="6" height="6" fill="none" stroke="#cb983c" stroke-width=".7"/><rect x="63" y="23" width="6" height="6" fill="none" stroke="#e0604f" stroke-width=".7"/>
    <path d="M75 23v6M78 23v6M81 23v6M86 23v6M89 23v6M96 23v6" stroke="#cb983c" stroke-width=".8"/></svg>`;
}
function introHTML(){
  const row=(id,k)=>Array.from({length:k},()=>`<svg viewBox="0 0 40 64"><use href="#${id}"/></svg>`).join("");
  const part=(cls,pic,name,desc)=>`<div class="part"><div class="pic ${cls}">${pic}</div><p><b>${name}</b><small>${desc}</small></p></div>`;
  return `<p class="partshead">盒中配件</p><div class="parts">
    ${part("pb",miniBoard(),"棋盘 × 1","盒子的滑盖就是棋盘，3 行 × 10 格")}
    ${part("pp",row("lotus",5),"金色莲花柱 × 5","一方的棋子")}
    ${part("pp",row("djed",5),"黑色杰德柱 × 5","另一方的棋子")}
    ${part("ps",[1,1,0,0].map(stickSVG).join(""),"掷棒 × 4","一面金色平面，一面黑色弧面")}
  </div>`;
}
function captionHTML(){
  const l=L();
  if(l.key==="intro")return cap("info",use("ankh"),"","古代规则没有流传下来。<br>这里采用 Kendall 1978 年的复原玩法。");
  if(l.key==="sticks"){const r=E.sticks(S.faces);
    return cap(r.again?"ok":"info",r.steps,`走 ${r.steps} 步 · ${r.again?"再掷一次":"换对方"}`,r.light===0?"一根金面都没有，<br>不是 0 步，而是 5 步。":`${r.light} 根金面朝上。<br>点任意一根可以翻面。`,S.thrown);}
  if(!S.done)return cap("info",use("ankh"),"",l.scene);
  const ok=!S.result||S.result.ok;return cap(ok?"ok":"bad",ok?"✓":"✕",l.verdict,l.result,true);
}
const cap=(cls,seal,title,text,anim)=>`<div class="caption ${cls}${anim?" anim":""}" role="status"><span class="seal">${seal}</span><p>${title?`<strong>${title}</strong>`:""}${text}</p></div>`;
function actionHTML(){
  const l=L();
  if(l.key==="intro")return "";
  if(l.key==="setup")return S.done?`<div class="actions"><button class="act ghost" data-act="again">${use("redo")}再摆一次</button></div>`:`<div class="actions"><button class="act" data-act="setup">摆棋</button></div>`;
  if(l.key==="sticks")return `<div class="actions"><button class="act" data-act="throw">掷一次</button></div>`;
  if(!S.done){const who=S.board[l.from].side==="g"?"金棋":"黑棋";return `<div class="actions"><button class="act" data-act="go">${who}走 ${l.roll} 步${use("arrow-r")}</button></div>`;}
  return `<div class="actions"><button class="act ghost" data-act="again">${use("redo")}再看一遍</button></div>`;
}
/* 封面主图：神庙门。凹弧檐口 + 双线门框 + 红日；门里立着两枚棋，门槛是棋盘最后五格（26–30），也就是离开冥界的出口 */
function portal(){
  let flutes="";for(let x=64;x<=236;x+=8)flutes+=`M${x} ${(36+Math.abs(x-150)*0).toFixed(1)}V55`;
  const glyph=[["nefer",1],["water",0],["three",0],["two",0],["one",0]];
  const strip=glyph.map(([g,fr],i)=>{const x=60+i*36;return `<rect x="${x}" y="252" width="36" height="34" fill="#20262c"/>
     ${i===1?`<rect x="${x+5}" y="256" width="26" height="26" fill="none" stroke="#ba3024" stroke-width="1.2"/>`:fr?`<rect x="${x+5}" y="256" width="26" height="26" fill="none" stroke="#cb983c" stroke-width="1.2"/>`:""}
     <svg x="${x+10}" y="259" width="16" height="20" color="${i===1?"#e0604f":"#cb983c"}"><use href="#${g}"/></svg>`;}).join("");
  return `<svg class="portal" viewBox="38 24 230 266" aria-hidden="true">
    <defs><radialGradient id="glow" cx=".5" cy=".62" r=".6"><stop offset="0" stop-color="#ecc777" stop-opacity=".34"/><stop offset=".55" stop-color="#cb983c" stop-opacity=".08"/><stop offset="1" stop-color="#cb983c" stop-opacity="0"/></radialGradient>
      <linearGradient id="cornice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cb983c" stop-opacity=".28"/><stop offset="1" stop-color="#cb983c" stop-opacity=".04"/></linearGradient></defs>
    <rect x="71" y="68" width="158" height="176" fill="url(#glow)"/>
    <g fill="none" stroke="#cb983c">
      <path d="M42 30H258" stroke-width="1.6"/>
      <path d="M60 58C55 48 49 40 44 33H256C251 40 245 48 240 58Z" fill="url(#cornice)" stroke-width="1.2"/>
      <path d="${flutes}" stroke-width=".8" opacity=".75"/>
      <rect x="58" y="58" width="184" height="7" stroke-width="1.2"/>
      <path d="${Array.from({length:23},(_,i)=>`M${62+i*8} 65l6-7`).join("")}" stroke-width=".7" opacity=".7"/>
      <path d="M60 65V246M240 65V246" stroke-width="1.4"/>
      <path d="M70 65V244H230V65" stroke-width=".9" opacity=".7"/>
    </g>
    <circle cx="150" cy="94" r="17" fill="none" stroke="#cb983c" stroke-width=".9" opacity=".8"/>
    <circle cx="150" cy="94" r="11.5" fill="#ba3024"/>
    <path d="M118 94h-22M182 94h22" stroke="#cb983c" stroke-width=".9" opacity=".8"/>
    <ellipse cx="150" cy="243" rx="68" ry="4" fill="#000" opacity=".55"/>
    <use href="#lotus" x="98" y="158" width="50" height="80"/>
    <use href="#djed" x="152" y="157.5" width="50" height="80.6"/>
    <path d="M52 246H248" stroke="#cb983c" stroke-width="1.6"/>
    <rect x="59.25" y="251.25" width="181.5" height="35.5" fill="#cb983c"/>
    ${strip}
    <path d="M248 269h10" stroke="#cb983c" stroke-width="1"/><path d="M264 269l-7-3.2v6.4z" fill="#cb983c"/>
  </svg>`;
}
function coverHTML(){
  return `<div class="cover">
   <p class="over">Passing Through the Netherworld</p>
   ${portal()}
   <div><h1><span class="cn carve">塞尼特棋</span><span class="lat carve">SENET</span></h1>
     <p class="tag">穿越冥界的游戏</p></div>
   <div><button class="cta" data-goto="0">开始</button><p class="src">规则依据 Timothy Kendall（1978）复原版 · 左右滑动翻页</p></div>
  </div>`;
}
function render(dx){
  const v=$("view"),inLesson=S.page>=0;
  if(!inLesson)v.innerHTML=coverHTML();
  else{
    const l=L(),head=`<p class="kicker"><span class="cno">${pad(l.ch)}</span>${CHAPTERS[l.ch]}${l.subs>1?`<span class="sub">${l.sub} / ${l.subs}</span>`:""}</p><h1 class="ltitle carve">${l.title}</h1><p class="rule">${l.rule}</p>`;
    const stage=l.key==="intro"?introHTML():l.key==="setup"?boardHTML():l.key==="sticks"?sticksHTML():trackHTML(l);
    v.innerHTML=head+`<section class="shrinebox"><div class="stage">${stage}</div>${captionHTML()}</section>`+actionHTML();
  }
  $("navbar").hidden=!inLesson;$("count").textContent=inLesson?`${pad(L().ch)} / ${pad(CHAPTERS.length-1)}`:"";
  $("dots").innerHTML=LESSONS.map((_,i)=>`<i class="${i===S.page?"on":""}"></i>`).join("");
  $("prev").setAttribute("aria-label",S.page===0?"回到封面":"上一页");$("next").disabled=S.page===LESSONS.length-1;
  if(dx!==undefined){v.classList.remove("enter");void v.offsetWidth;v.style.setProperty("--dx",dx+"px");v.classList.add("enter");v.scrollTop=0;}
  requestAnimationFrame(drawArrow);
  const tr=$("track");if(tr){arrowRO.disconnect();arrowRO.observe(tr);}
}
const arrowRO=new ResizeObserver(()=>drawArrow());
document.fonts&&document.fonts.ready.then(()=>drawArrow());

/* ---------- 箭头与动画 ---------- */
function drawArrow(){
  const svg=$("arrow");if(!svg)return;const l=L();
  if(S.done||!l.from){svg.innerHTML="";return;}
  const to=l.from+l.roll,tq=to>30?"out":to,box=svg.getBoundingClientRect();
  const a=$("track").querySelector(`[data-sq="${l.from}"]`),b=$("track").querySelector(`[data-sq="${tq}"]`);if(!a||!b)return;
  const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
  const x1=ra.left+ra.width/2-box.left,y1=ra.top-box.top+2,x2=rb.left+rb.width/2-box.left,y2=rb.top-box.top+2,h=Math.min(24,8+Math.abs(x2-x1)*.12);
  svg.setAttribute("viewBox",`0 0 ${box.width} ${box.height}`);
  svg.innerHTML=`<path d="M${x1} ${y1}Q${(x1+x2)/2} ${y1-h*2} ${x2} ${y2-2}"/><path class="head" d="M${x2} ${y2+2}l-5-8h10z"/>`;
}
const centerOf=el=>{const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];};
const snapshot=()=>{const m=new Map();document.querySelectorAll("#view [data-id]").forEach(el=>m.set(el.dataset.id,centerOf(el)));return m;};
function animateMoves(before,moves,way){
  if(reduce())return Promise.resolve();
  return Promise.all(moves.map(mv=>{
    const el=document.querySelector(`#view [data-id="${mv.id}"]`),start=before.get(mv.id);if(!el||!start)return null;
    const end=centerOf(el),pts=[start,...(way[mv.id]||[]),end],segs=pts.length-1,frames=[];
    pts.forEach((p,i)=>{frames.push({transform:`translate(${p[0]-end[0]}px,${p[1]-end[1]}px)`,offset:i/segs});
      if(i<segs){const q=pts[i+1],lift=Math.min(34,14+Math.abs(q[0]-p[0])*.18);frames.push({transform:`translate(${(p[0]+q[0])/2-end[0]}px,${(p[1]+q[1])/2-end[1]-lift}px)`,offset:(i+.5)/segs});}});
    el.style.zIndex=5;
    return settle(el.animate(frames,{duration:560*segs,easing:"cubic-bezier(.3,.7,.3,1)"}),560*segs).then(()=>el.style.zIndex="");
  }));
}
function bump(from,to){
  const el=document.querySelector(`#view [data-sq="${from}"] [data-id]`),t=document.querySelector(`#view [data-sq="${to}"]`);
  if(!el||!t||reduce())return Promise.resolve();
  const a=centerOf(el),b=centerOf(t),dx=(b[0]-a[0])*.55,dy=(b[1]-a[1])*.55;
  return settle(el.animate([{transform:"none"},{transform:`translate(${dx}px,${dy-18}px)`,offset:.45},{transform:`translate(${dx*.8}px,${dy-8}px)`,offset:.6},{transform:"none"}],{duration:760,easing:"ease-in-out"}),760);
}
function tossSticks(){if(reduce())return;document.querySelectorAll(".stick").forEach((el,i)=>el.animate([{transform:"translateY(-34px) rotate(-14deg) scaleX(.2)"},{transform:"none"}],{duration:440,delay:i*60,easing:"cubic-bezier(.3,1.4,.5,1)",fill:"backwards"}));}
function playRoute(){const p=$("route");if(p&&!reduce())p.animate([{strokeDasharray:"0 1"},{strokeDasharray:"1 0"}],{duration:2400,easing:"ease-in-out"});}

async function play(){
  const l=L(),r=E.move(S.board,l.from,l.roll);S.result=r;
  if(!r.ok){
    // 先让棋子试着冲过去再弹回，然后标红原因格
    const to=l.from+l.roll>30?"out":l.from+l.roll;
    document.querySelector("#arrow").innerHTML="";
    await bump(l.from,to);S.done=true;render();
    document.querySelectorAll("#view .cell.bad").forEach(c=>!reduce()&&c.animate([{transform:"translateX(-3px)"},{transform:"translateX(3px)"},{transform:"none"}],{duration:280,iterations:2}));
    return;
  }
  const before=snapshot(),way={};
  for(const mv of r.moves)if(mv.path.length>2){const w=document.querySelector(`#view [data-sq="${mv.path[1]}"]`);if(w){const c=centerOf(w);way[mv.id]=[[c[0],c[1]-6]];}}
  if(r.kind==="exit")S.out=[S.board[l.from]];
  S.board=r.board;S.done=true;render();
  await animateMoves(before,r.moves,way);
}
async function placePieces(){
  S.done=true;render();if(reduce())return;
  const els=Array.from({length:10},(_,i)=>document.querySelector(`#view [data-id="s${i+1}"]`));
  els.forEach(el=>el&&(el.style.opacity=0));
  const route=$("route");if(route)route.style.opacity=0;
  for(const el of els){if(!el)continue;el.style.opacity="";el.animate([{transform:"translateY(-22px)",opacity:0},{transform:"none",opacity:1}],{duration:260,easing:"cubic-bezier(.3,1.3,.5,1)"});await sleep(110);}
  await sleep(250);if(route){route.style.opacity="";playRoute();}
}
async function act(kind){
  if(S.busy)return;S.busy=true;
  try{
    if(kind==="go")await play();
    else if(kind==="again"){reset();render();}
    else if(kind==="setup")await placePieces();
    else if(kind==="throw"){S.faces=Array.from({length:4},()=>Math.random()<.5);S.thrown=true;render();tossSticks();}
  }finally{S.busy=false;}
}
function show(i,dir){
  if(i<-1||i>=LESSONS.length||S.busy)return;
  const prev=S.page;S.page=i;if(i>=0)reset();
  render(dir!==undefined?dir:(i>prev?14:-14));
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-goto],[data-act],[data-stick],[data-close]");if(!t)return;
  if(t.hasAttribute("data-close")){t.closest("dialog").close();return;}
  if(t.hasAttribute("data-goto")){e.preventDefault();if($("toc").open)$("toc").close();show(Number(t.dataset.goto));return;}
  if(t.hasAttribute("data-stick")){const i=Number(t.dataset.stick);S.faces[i]=!S.faces[i];S.thrown=true;render();
    const el=document.querySelector(`[data-stick="${i}"]`);if(el&&!reduce())el.animate([{transform:"scaleX(.1)"},{transform:"none"}],{duration:220,easing:"ease-out"});return;}
  act(t.dataset.act);
});
$("home").onclick=()=>show(-1);$("prev").onclick=()=>show(S.page-1);$("next").onclick=()=>show(S.page+1);
$("open-toc").onclick=()=>{$("toc-list").innerHTML=LESSONS.map((l,i)=>`${l.sub===1?`<h3><span>${pad(l.ch)}</span>${CHAPTERS[l.ch]}</h3>`:""}<button data-goto="${i}" aria-current="${i===S.page}">${l.title}</button>`).join("");$("toc").showModal();};
document.querySelectorAll("dialog").forEach(d=>d.addEventListener("click",e=>{if(e.target===d)d.close();}));
document.addEventListener("keydown",e=>{
  if(document.querySelector("dialog[open]")||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==="ArrowRight"&&S.page<LESSONS.length-1){e.preventDefault();show(S.page+1);}
  if(e.key==="ArrowLeft"&&S.page>-1){e.preventDefault();show(S.page-1);}
});
let touch=null;
$("main").addEventListener("touchstart",e=>{const p=e.touches[0];touch=e.touches.length===1?{x:p.clientX,y:p.clientY,t:Date.now()}:null;},{passive:true});
$("main").addEventListener("touchend",e=>{
  if(!touch)return;const p=e.changedTouches[0],dx=p.clientX-touch.x,dy=p.clientY-touch.y,dt=Date.now()-touch.t;touch=null;
  if(dt<800&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.6){const i=S.page+(dx<0?1:-1);if(i>=-1&&i<LESSONS.length)show(i);}
},{passive:true});
addEventListener("resize",()=>requestAnimationFrame(drawArrow));
render();
})();
</script>
</body>
</html>
