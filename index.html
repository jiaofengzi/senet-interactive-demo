function choices(list,kind="switch",label="选择"){
 return list.length?'<div class="option-row" role="group" aria-label="'+label+'">'+list.map(o=>{
   const i=matches.push(o.action)-1;return '<button class="chip" data-role="'+kind+'" data-option="'+i+'" data-key="op'+i+'" aria-label="'+esc(o.label)+'" aria-pressed="'+!!o.selected+'">'+optionMark(o,kind)+'</button>';
 }).join("")+"</div>":"";
}
function scene(){
 const s=states[curr];matches=[];
 $("scene").innerHTML=curr===1?sticks(s):board(s);
 $("figure").innerHTML=figures(s);
 $("opts").innerHTML=curr===0?choices([{label:"路线",selected:!opening,action:{type:"opening",value:false}},{label:"开局",selected:opening,action:{type:"opening",value:true}}],"switch","路线或开局"):curr===6?choices(s.optionGroups[0].options,"score","掷点"):choices(s.options,curr===4||curr===5?"tile":"switch","演示选项");
 const primary=["前进一格","一起掷一次",s.step?"回到原位":"走 4 步",s.step?"回到原位":"试走到 11",s.step?"重看落水":"走到水格",s.step?"回到原位":"走到落点","试着离场"][curr];
 $("controls").innerHTML=(curr===0&&opening||curr===4&&s.target!==27||curr===6&&s.done?"":'<button class="control main" data-main data-key="main">'+(curr===0&&s.route===30?"从头再走":primary)+'</button>')+(curr===6?'<button class="control secondary" data-secondary data-key="secondary">重新摆放</button>':"");
 $("tray").innerHTML=curr===6?'<div class="offboard" role="img" aria-label="已离场 '+s.offboard.length+' 枚">'+[28,29,30].map(n=>'<span'+(s.offboard.includes(n)?' class="out"':"")+'>'+(s.offboard.includes(n)?pawnArt({id:"end"+n,side:"gold"},"off-piece"):"")+"</span>").join("")+"</div>":"";
 $("message").textContent=status(s);
}
const center=e=>{const r=e.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];};
const pieces=()=>[...$("lesson").querySelectorAll("[data-piece]")];
function animateMove(before,oldState,action){
 if(!before||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const s=states[curr];
 for(const el of pieces()){
  const start=before.get(el.dataset.piece);if(!start)continue;
  const end=center(el);if(Math.hypot(end[0]-start[0],end[1]-start[1])<1)continue;
  const key=(at,offset)=>({transform:`translate(${at[0]-end[0]}px,${at[1]-end[1]}px)`,offset});
  const waypoint=n=>center($("scene").querySelector('[data-cell="'+n+'"]'));
  let frames=[key(start,0),key(end,1)],duration=380;
  if(curr===4&&s.target===27&&!oldState.step&&s.step){
   frames=[key(start,0),key(waypoint(25),.18),key(waypoint(26),.34),key(waypoint(27),.51),key(waypoint(27),.63),key(end,1)];duration=920;
  }else if((curr===2||curr===3)&&s.step){
   const dx=el.dataset.piece==="gold"?7:-7;
   frames=[key(start,0),key([(start[0]+end[0])/2+dx,(start[1]+end[1])/2],.5),key(end,1)];
  }
  el.animate(frames,{duration,easing:"cubic-bezier(.23,.74,.29,1)"});
 }
 if(curr===1){
  const bars=$("scene").querySelectorAll(".stick svg");
  bars.forEach((el,i)=>{if(action.type!=="stick"||i===action.index)el.animate([{transform:"rotateY(88deg)"},{transform:"rotateY(0)"}],{duration:210,delay:action.type==="throw"?i*38:0,easing:"ease-out",fill:"backwards"});});
 }
}
function show(i,focus=true){
 if(i< -1||i>=pages.length)return;
 const prior=curr;curr=i;$("sheet").dataset.cover=String(i===-1);$("cover").hidden=i!==-1;$("lesson").hidden=i===-1;$("nav").hidden=i===-1;
 if(i>=0){
  states[i]??=initial(i); const [eyebrow,title,lead]=pages[i];
  $("chapter").textContent=eyebrow;$("title").textContent=title;$("lead").textContent=lead;$("count").textContent=pad(i+1)+" / "+pad(pages.length);
  $("dots").innerHTML=pages.map((_,k)=>'<i'+(k===i?' class="on"':'')+'></i>').join("");
  $("prev-label").textContent=i===0?"封面":"上一页";$("next").disabled=i===pages.length-1;
  $("lesson").classList.remove("slide-in");void $("lesson").offsetWidth;$("lesson").style.setProperty("--travel",i<prior?"-5px":"5px");$("lesson").classList.add("slide-in");scene();
 }
 if(focus)$("main").focus({preventScroll:true});
}
$("index-list").innerHTML=pages.map(([p],i)=>'<button data-page="'+i+'"><small>'+pad(i+1)+'</small>'+p+'</button>').join("");
$("start").onclick=()=>show(0);$("home").onclick=()=>show(-1);$("prev").onclick=()=>show(curr-1);$("next").onclick=()=>show(curr+1);
$("open-index").onclick=()=>$("index").showModal();$("close-index").onclick=()=>$("index").close();
$("index-list").onclick=e=>{const b=e.target.closest("[data-page]");if(b){$("index").close();show(Number(b.dataset.page));}};
$("open-rules").onclick=()=>{
 const copy=[...lessons[curr].details];
 if(curr===1)copy.push("金色平面对应浅面，黑色圆背对应深面；配色只帮助认面。");
 if(curr===6)copy.push(...boundaries.slice(1));
 $("rules-heading").textContent=pages[curr][0];$("rules-copy").innerHTML=copy.map(p=>"<p>"+esc(p)+"</p>").join("")+'<p class="source">本教程采用 <a href="'+source+'" target="_blank" rel="noopener">Museum of Gaming 的现代复原规则</a>。古代完整规则未存世。</p>';$("rules").showModal();
};
$("close-rules").onclick=()=>$("rules").close();
$("lesson").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b||curr<0||Date.now()<ignoreClick||b.id==="open-rules")return;
 const s=states[curr];let a;
 if(b.hasAttribute("data-main"))a=curr===1?{type:"throw",faces:Array.from({length:4},()=>Math.random()<.5)}:"advance";
 else if(b.hasAttribute("data-secondary"))a="reset";
 else if(b.hasAttribute("data-option"))a=matches[Number(b.dataset.option)];
 else if(b.hasAttribute("data-square"))a={type:"square",square:Number(b.dataset.square)};
 else if(b.hasAttribute("data-stick"))a={type:"stick",index:Number(b.dataset.stick)};
 if(a==null)return;
 const key=b.dataset.key,before=new Map(pieces().map(el=>[el.dataset.piece,center(el)]));
 if(a.type==="opening")opening=a.value;else states[curr]=act(s,a);
 scene();animateMove(before,s,a);
 if(key)(document.querySelector('[data-key="'+key+'"]')??$("main")).focus({preventScroll:true});
});
document.addEventListener("keydown",e=>{
 if($("index").open||$("rules").open||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest("button,a,input,select,textarea"))return;
 if(e.key==="ArrowLeft"&&curr>=0){e.preventDefault();show(curr-1);}
 if(e.key==="ArrowRight"&&curr<pages.length-1){e.preventDefault();show(curr+1);}
});
$("main").addEventListener("touchstart",e=>{if(e.touches.length===1){const p=e.touches[0];touch={x:p.clientX,y:p.clientY};}else touch=null;},{passive:true});
$("main").addEventListener("touchcancel",()=>{touch=null;},{passive:true});
$("main").addEventListener("touchend",e=>{
 if(!touch)return;const p=e.changedTouches[0],x=p.clientX-touch.x,y=p.clientY-touch.y;touch=null;
 const i=curr+(x<0?1:-1);
 if(Math.abs(x)>35&&Math.abs(x)>Math.abs(y)*1.5&&i>=-1&&i<pages.length){ignoreClick=Date.now()+390;show(i);}
},{passive:true});
show(-1,false);
})();
</script>
</body></html>
